                  MustTaskType.ASR to R.id.dotAsr,
                  MustTaskType.MAGHRIB to R.id.dotMaghrib,
                  MustTaskType.ISHA to R.id.dotIsha
              )
              dots.forEach { (type, viewId) ->
                  val dot = findViewById<View>(viewId) ?: return@forEach
                  val task = mustTasks.firstOrNull { it.mustTaskType == type }
                  val colorRes = when (task?.status) {
