          python3 - << 'EOF_MAIN_LAYOUT_PATCH'
          path = "app/src/main/res/layout/activity_main.xml"
          with open(path) as f:
              content = f.read()

          # Robust insertion: find the textGatekeeperWarning TextView by its id,
          # then insert the day-arc include right after that element's closing
          # "/>", wherever exactly that lands. No dependence on matching the
          # whole multi-line block verbatim.
          anchor = 'android:id="@+id/textGatekeeperWarning"'
          idx = content.find(anchor)
          if idx != -1:
              close_idx = content.find('/>', idx)
              if close_idx != -1:
                  insert_pos = close_idx + 2
                  include_tag = '\n\n    <include layout="@layout/view_day_arc.xml" />\n'
                  content = content[:insert_pos] + include_tag + content[insert_pos:]

          # Cosmetic eyebrow-label styling — best-effort, harmless no-op if
          # the exact text isn't found (won't break the build either way).
          content = content.replace(
              'android:text="Must-do today"\n            android:textSize="18sp"\n            android:textStyle="bold" />',
