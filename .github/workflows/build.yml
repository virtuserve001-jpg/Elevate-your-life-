name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o EYL_project.zip -d .
          shopt -s dotglob
          rm -rf EYL/.github
          mv EYL/* .
          rmdir EYL
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Patch source files
        run: |
          cat > app/src/main/java/com/eyl/app/engine/PhoneUntouchedMonitor.kt << 'EOF_MONITOR'
          package com.eyl.app.engine

          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Handler
          import android.os.Looper

          class PhoneUntouchedMonitor(private val context: Context) {

              private var receiver: BroadcastReceiver? = null
              private var graceHandler: Handler? = null
              private var graceRunnable: Runnable? = null

              fun start(gracePeriodMs: Long = 15000, onPhoneTouched: () -> Unit): Boolean {
                  stop()

                  val r = object : BroadcastReceiver() {
                      override fun onReceive(ctx: Context?, intent: Intent?) {
                          when (intent?.action) {
                              Intent.ACTION_SCREEN_ON, Intent.ACTION_USER_PRESENT -> onPhoneTouched()
                          }
                      }
                  }
                  receiver = r
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }

                  val handler = Handler(Looper.getMainLooper())
                  graceHandler = handler
                  val runnable = Runnable {
                      enableDnd()
                      context.registerReceiver(r, filter)
                  }
                  graceRunnable = runnable
                  handler.postDelayed(runnable, gracePeriodMs)

                  return false
              }

              fun stop() {
                  graceRunnable?.let { graceHandler?.removeCallbacks(it) }
                  graceRunnable = null
                  graceHandler = null

                  receiver?.let {
                      try {
                          context.unregisterReceiver(it)
                      } catch (e: IllegalArgumentException) {
                      }
                  }
                  receiver = null

                  disableDnd()
              }

              private fun enableDnd() {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                  if (nm?.isNotificationPolicyAccessGranted == true) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE)
                  }
              }

              private fun disableDnd() {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                  if (nm?.isNotificationPolicyAccessGranted == true) {
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
                  }
              }
          }
          EOF_MONITOR

          cat > app/src/main/java/com/eyl/app/engine/PrayerTimeApi.kt << 'EOF_API'
          package com.eyl.app.engine

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.LocationManager
          import androidx.core.app.ActivityCompat
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.time.LocalDate
          import java.time.LocalTime
          import java.time.format.DateTimeFormatter

          object PrayerTimeApi {

              data class PrayerTimes(
                  val fajr: LocalTime,
                  val dhuhr: LocalTime,
                  val asr: LocalTime,
                  val maghrib: LocalTime,
                  val isha: LocalTime
              )

              fun fetchTodayTimes(context: Context): PrayerTimes? {
                  val hasPermission = ActivityCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED || ActivityCompat.checkSelfPermission(
                      context, Manifest.permission.ACCESS_COARSE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED

                  if (!hasPermission) return null

                  val locationManager = context.getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                      ?: return null

                  var lastLocation: android.location.Location? = null
                  for (provider in locationManager.getProviders(true)) {
                      val loc = try {
                          locationManager.getLastKnownLocation(provider)
                      } catch (e: SecurityException) {
                          null
                      }
                      if (loc != null && (lastLocation == null || loc.time > lastLocation!!.time)) {
                          lastLocation = loc
                      }
                  }
                  val location = lastLocation ?: return null

                  return try {
                      val today = LocalDate.now()
                      val dateStr = today.format(DateTimeFormatter.ofPattern("dd-MM-yyyy"))
                      val url = URL(
                          "https://api.aladhan.com/v1/timings/$dateStr" +
                              "?latitude=${location.latitude}&longitude=${location.longitude}&method=3"
                      )
                      val connection = url.openConnection() as HttpURLConnection
                      connection.connectTimeout = 10000
                      connection.readTimeout = 10000
                      connection.requestMethod = "GET"

                      if (connection.responseCode != 200) return null

                      val body = connection.inputStream.bufferedReader().use { it.readText() }
                      val timings = JSONObject(body).getJSONObject("data").getJSONObject("timings")

                      fun parseTime(key: String): LocalTime {
                          val raw = timings.getString(key).substringBefore(" ")
                          return LocalTime.parse(raw, DateTimeFormatter.ofPattern("HH:mm"))
                      }

                      PrayerTimes(
                          fajr = parseTime("Fajr"),
                          dhuhr = parseTime("Dhuhr"),
                          asr = parseTime("Asr"),
                          maghrib = parseTime("Maghrib"),
                          isha = parseTime("Isha")
                      )
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF_API

          cat > app/src/main/java/com/eyl/app/engine/PrayerScheduleWorker.kt << 'EOF_WORKER'
          package com.eyl.app.engine

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import androidx.work.*
          import com.eyl.app.data.model.MustTaskType
          import com.eyl.app.service.PrayerAlarmReceiver
          import java.time.Duration
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.LocalTime
          import java.time.ZoneId
          import java.util.concurrent.TimeUnit

          class PrayerScheduleWorker(
              context: Context,
              params: WorkerParameters
          ) : CoroutineWorker(context, params) {

              override suspend fun doWork(): Result {
                  val times = PrayerTimeApi.fetchTodayTimes(applicationContext) ?: return Result.success()

                  schedule(MustTaskType.FAJR, times.fajr)
                  schedule(MustTaskType.DHUHR, times.dhuhr)
                  schedule(MustTaskType.ASR, times.asr)
                  schedule(MustTaskType.MAGHRIB, times.maghrib)
                  schedule(MustTaskType.ISHA, times.isha)

                  return Result.success()
              }

              private fun schedule(type: MustTaskType, time: LocalTime) {
                  val today = LocalDate.now()
                  val alarmManager = applicationContext.getSystemService(Context.ALARM_SERVICE) as AlarmManager

                  val notifyAt = LocalDateTime.of(today, time)
                  val autoStartAt = notifyAt.plusMinutes(10)

                  setExactAlarm(alarmManager, type, notifyAt, isAutoStart = false, requestCode = 4000 + type.ordinal)
                  setExactAlarm(alarmManager, type, autoStartAt, isAutoStart = true, requestCode = 5000 + type.ordinal)
              }

              private fun setExactAlarm(
                  alarmManager: AlarmManager,
                  type: MustTaskType,
                  triggerAt: LocalDateTime,
                  isAutoStart: Boolean,
                  requestCode: Int
              ) {
                  if (triggerAt.isBefore(LocalDateTime.now())) return

                  val intent = Intent(applicationContext, PrayerAlarmReceiver::class.java).apply {
                      putExtra(PrayerAlarmReceiver.EXTRA_MUST_TASK_TYPE, type.name)
                      putExtra(PrayerAlarmReceiver.EXTRA_IS_AUTO_START, isAutoStart)
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      applicationContext, requestCode, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val triggerMillis = triggerAt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()
                  alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerMillis, pendingIntent)
              }
          }

          object PrayerScheduler {
              private const val WORK_NAME = "eyl_prayer_schedule"

              fun scheduleDaily(context: Context) {
                  val now = LocalDateTime.now()
                  var nextRun = LocalDateTime.of(now.toLocalDate(), LocalTime.of(0, 15))
                  if (now.isAfter(nextRun)) nextRun = nextRun.plusDays(1)
                  val initialDelay = Duration.between(now, nextRun).toMinutes()

                  val request = PeriodicWorkRequestBuilder<PrayerScheduleWorker>(24, TimeUnit.HOURS)
                      .setInitialDelay(initialDelay, TimeUnit.MINUTES)
                      .build()

                  WorkManager.getInstance(context).enqueueUniquePeriodicWork(
                      WORK_NAME,
                      ExistingPeriodicWorkPolicy.KEEP,
                      request
                  )
              }
          }
          EOF_WORKER

          cat > app/src/main/java/com/eyl/app/service/PrayerAlarmReceiver.kt << 'EOF_RECEIVER'
          package com.eyl.app.service

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import com.eyl.app.EylApplication
          import com.eyl.app.data.model.MustTaskType
          import kotlinx.coroutines.launch
          import java.time.LocalDate

          class PrayerAlarmReceiver : BroadcastReceiver() {

              companion object {
                  const val EXTRA_MUST_TASK_TYPE = "extra_must_task_type"
                  const val EXTRA_IS_AUTO_START = "extra_is_auto_start"
                  private const val CHANNEL_ID = "eyl_prayer_channel"
                  private const val NOTIFICATION_ID_BASE = 4000
              }

              override fun onReceive(context: Context, intent: Intent) {
                  val typeName = intent.getStringExtra(EXTRA_MUST_TASK_TYPE) ?: return
                  val mustTaskType = try {
                      MustTaskType.valueOf(typeName)
                  } catch (e: IllegalArgumentException) {
                      return
                  }
                  val isAutoStart = intent.getBooleanExtra(EXTRA_IS_AUTO_START, false)

                  if (isAutoStart) {
                      val app = context.applicationContext as EylApplication
                      app.applicationScope.launch {
                          val today = LocalDate.now()
                          val task = app.repository.getMustTasksForDate(today)
                              .firstOrNull { it.mustTaskType == mustTaskType }
                          if (task != null) {
                              LockdownForegroundService.startTask(context, task.id)
                          }
                      }
                  } else {
                      postNotification(context, mustTaskType)
                  }
              }

              private fun postNotification(context: Context, type: MustTaskType) {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "Prayer times", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("${type.name} time has entered")
                      .setContentText("Task will auto-start in 10 minutes, or open EYL to start now.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .build()
                  nm.notify(NOTIFICATION_ID_BASE + type.ordinal, notification)
              }
          }
          EOF_RECEIVER

          cat > app/src/main/java/com/eyl/app/EylApplication.kt << 'EOF_APP'
          package com.eyl.app

          import android.app.Application
          import com.eyl.app.data.EylRepository
          import com.eyl.app.data.db.EylDatabase
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.SupervisorJob

          class EylApplication : Application() {

              val applicationScope = CoroutineScope(SupervisorJob())

              lateinit var database: EylDatabase
                  private set
              lateinit var repository: EylRepository
                  private set

              override fun onCreate() {
                  super.onCreate()
                  database = EylDatabase.getInstance(this)
                  repository = EylRepository(database)

                  com.eyl.app.engine.DailyRolloverScheduler.scheduleDaily(this)
                  com.eyl.app.engine.PrayerScheduler.scheduleDaily(this)
              }
          }
