          cat > app/src/main/java/com/eyl/app/data/ReadingAppPreference.kt << 'EOF_PREF'
          package com.eyl.app.data

          import android.content.Context

          object ReadingAppPreference {
              private const val PREFS_NAME = "eyl_prefs"
              private const val KEY_PACKAGE = "reading_app_package"
              private const val KEY_LABEL = "reading_app_label"

              fun getSelectedPackage(context: Context): String? =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getString(KEY_PACKAGE, null)

              fun getSelectedLabel(context: Context): String? =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getString(KEY_LABEL, null)

              fun setSelectedApp(context: Context, packageName: String, label: String) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_PACKAGE, packageName)
                      .putString(KEY_LABEL, label)
                      .apply()
              }
          }
          EOF_PREF

          cat > app/src/main/java/com/eyl/app/ui/PickAppActivity.kt << 'EOF_PICKER'
          package com.eyl.app.ui

          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.ImageView
          import android.widget.ListView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.eyl.app.R
          import com.eyl.app.data.ReadingAppPreference

          class PickAppActivity : AppCompatActivity() {

              private data class AppEntry(val packageName: String, val label: String, val icon: Drawable)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_pick_app)

                  val listView = findViewById<ListView>(R.id.listApps)
                  val pm = packageManager

                  val launcherIntent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                  val resolveInfos = pm.queryIntentActivities(launcherIntent, 0)

                  val entries = resolveInfos
                      .filter { it.activityInfo.packageName != packageName }
                      .map { info ->
                          AppEntry(
                              packageName = info.activityInfo.packageName,
                              label = info.loadLabel(pm).toString(),
                              icon = info.loadIcon(pm)
                          )
                      }
                      .distinctBy { it.packageName }
                      .sortedBy { it.label.lowercase() }

                  val adapter = object : ArrayAdapter<AppEntry>(this, 0, entries) {
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val view = convertView ?: LayoutInflater.from(context)
                              .inflate(R.layout.item_installed_app, parent, false)
                          val entry = getItem(position)!!
                          view.findViewById<ImageView>(R.id.imageAppIcon).setImageDrawable(entry.icon)
                          view.findViewById<TextView>(R.id.textAppLabel).text = entry.label
                          return view
                      }
                  }
                  listView.adapter = adapter

                  listView.setOnItemClickListener { _, _, position, _ ->
                      val entry = entries[position]
                      ReadingAppPreference.setSelectedApp(this, entry.packageName, entry.label)
                      setResult(RESULT_OK)
                      finish()
                  }
              }
          }
          EOF_PICKER

