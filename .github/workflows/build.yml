                      TaskStatus.FAILED -> R.color.eyl_ember
                      TaskStatus.IN_PROGRESS -> R.color.eyl_sage
                      else -> R.color.eyl_surface
                  }
                  dot.background.setTint(ContextCompat.getColor(this, colorRes))
              }
          }

