name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if EYL_project.zip exists
        run: |
          if [ ! -f "EYL_project.zip" ]; then
            echo "❌ ERROR: EYL_project.zip not found in repository root!"
            echo "This workflow requires EYL_project.zip to build the APK."
            ls -la
            exit 1
          fi
          echo "✅ EYL_project.zip found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: |
          echo "📦 Extracting EYL_project.zip..."
          unzip -o EYL_project.zip -d .
          shopt -s dotglob
          
          if [ -d "EYL" ]; then
            echo "📁 Moving EYL contents to root..."
            rm -rf EYL/.github 2>/dev/null || true
            mv EYL/* .
            rmdir EYL
          fi
          
          echo "⚙️  Configuring gradle.properties..."
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "✅ Project extracted successfully"

      - name: Build debug APK
        run: |
          echo "🔨 Starting Gradle build..."
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eyl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore
